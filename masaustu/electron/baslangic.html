<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Birlikte İzle</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; background:#0e0f13;
         color:#e8e9ee; font-family:system-ui,sans-serif; }
  .kart { width:min(460px,90vw); background:#171920; border:1px solid #2a2e39;
          border-radius:16px; padding:24px; display:grid; gap:14px; }
  h1 { margin:0; font-size:22px; }
  p { margin:0; color:#9096a6; font-size:14px; }
  input { background:#0e0f13; border:1px solid #2a2e39; border-radius:8px;
          padding:10px 12px; color:inherit; font:inherit; width:100%; }
  button { background:#7b5cff; border:none; border-radius:8px; padding:12px;
           color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { background:#9c86ff; }
  .ikincil { background:#232633; }
  .ikincil:hover { background:#2f3344; }
  .ipucu { font-size:13px; }
  .odalar { display:grid; gap:8px; }
  .odalar h2 { margin:0; font-size:15px; color:#e8e9ee; }
  .oda { display:flex; align-items:center; gap:12px; text-align:left; background:#0e0f13;
         border:1px solid #2a2e39; padding:8px; font-weight:500; }
  .oda:hover { background:#1f2330; }
  .oda img, .oda .afis-yok { width:36px; height:54px; border-radius:4px; object-fit:cover; background:#232633; flex:none; }
  .oda .ad { font-weight:600; }
  .oda .alt { font-size:12px; color:#9096a6; }
</style>
</head>
<body>
  <form class="kart" id="form">
    <h1>Birlikte İzle</h1>
    <div id="odalar" class="odalar" hidden></div>
    <p>Oda linkini yapıştır. Video, tarayıcı yerine mpv ile oynatılır: gerçek HDR, tüm ses dilleri, donanım çözme.</p>
    <input id="link" placeholder="http://... /room/ABC123" autocomplete="off" required>
    <button type="submit">Odaya gir</button>
    <button id="panel" type="button" class="ikincil" hidden>Film ara ve oda aç</button>
    <p id="panel-ipucu" class="ipucu" hidden>Sunucu bu bilgisayarda çalışıyor: Stremio'ya girmeden ara, seç, oda aç.</p>
    <button id="guncelle" type="button" class="ikincil">Güncellemeleri denetle</button>
    <p id="surum" class="ipucu" style="text-align:center"></p>
  </form>
<script>
  document.getElementById('surum').textContent = `Sürüm ${window.kabuk.surum?.() || '?'}`;
  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = document.getElementById('link').value.trim();
    if (v) window.kabuk.odayaGit(v);
  });
  // Oda açma yalnızca sunucuyu çalıştıran kişide anlamlı. Misafirlerde sunucu yok,
  // o yüzden düğmeyi ancak panel bu bilgisayarda cevap verirse gösteriyoruz.
  document.getElementById('panel').addEventListener('click', () => {
    window.kabuk.odayaGit('http://127.0.0.1:7001/ara');
  });
  fetch('http://127.0.0.1:7001/api/ping', { mode: 'no-cors', cache: 'no-store' })
    .then(() => {
      document.getElementById('panel').hidden = false;
      document.getElementById('panel-ipucu').hidden = false;
    })
    .catch(() => {});

  // Açık odalar: sende çalışan sunucu ve son girdiğin odanın sunucusu. Tünel adresi
  // değiştiyse (host sunucuyu yeniden başlattıysa) yeni linki yapıştırmak gerekiyor.
  async function odalariGetir() {
    // Ana süreç ntfy.sh'den host'un güncel adresini de buluyor (tünel adresi değişse bile).
    const sunucular = await window.kabuk.sunucular();
    const bulunan = [];
    await Promise.all(sunucular.map(async (sunucu) => {
      try {
        const yanit = await fetch(`${sunucu}/odalar.json`, { cache: 'no-store', signal: AbortSignal.timeout(4000) });
        for (const oda of await yanit.json()) bulunan.push({ ...oda, sunucu });
      } catch { /* sunucu kapalı */ }
    }));
    // Aynı oda iki yoldan (yerel ve tünel) gelebilir: bir kez göster.
    const tekil = [...new Map(bulunan.map((o) => [o.id, o])).values()];
    const kutu = document.getElementById('odalar');
    // Kapanan odalar listeden düşsün.
    if (!tekil.length) {
      kutu.hidden = true;
      return;
    }
    const baslik = document.createElement('h2');
    baslik.textContent = 'Açık odalar';
    kutu.replaceChildren(baslik, ...tekil.map((oda) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'oda';
      const afis = oda.poster ? Object.assign(document.createElement('img'), { src: oda.poster, alt: '' }) : Object.assign(document.createElement('div'), { className: 'afis-yok' });
      const yazi = document.createElement('div');
      const ad = Object.assign(document.createElement('div'), { className: 'ad', textContent: oda.name });
      const alt = Object.assign(document.createElement('div'), {
        className: 'alt',
        textContent: `${oda.users} kişi · ${oda.playing ? '▶ oynuyor' : '⏸ duraklatıldı'}`,
      });
      yazi.append(ad, alt);
      b.append(afis, yazi);
      b.addEventListener('click', () => window.kabuk.odayaGit(`${oda.sunucu}/room/${oda.id}`));
      return b;
    }));
    kutu.hidden = false;
  }
  odalariGetir();
  // Açılış ekranı açıkken liste tazelensin: kapanan oda kaybolsun, yeni oda gelsin.
  setInterval(odalariGetir, 5000);

  document.getElementById('guncelle').addEventListener('click', async (e) => {
    const b = e.target;
    b.disabled = true;
    b.textContent = 'Denetleniyor…';
    await window.kabuk.guncelle();
    b.disabled = false;
    b.textContent = 'Güncellemeleri denetle';
  });
</script>
</body>
</html>
