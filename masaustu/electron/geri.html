<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  button {
    width: 100%; height: 100%; display: grid; place-items: center; padding: 0; cursor: pointer; border-radius: 10px; border: 0; color: #e8e9ee;
    background: transparent; transition: background .12s;
  }
  button:hover, button.hover { background: rgba(255, 255, 255, .14); color: #fff; }
  svg { width: 28px; height: 28px; }
</style>
</head>
<body>
<button id="geri" type="button" title="Geri (odadan çık)" aria-label="Geri">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 5l-7 7 7 7"/></svg>
</button>
</body>
</html>
