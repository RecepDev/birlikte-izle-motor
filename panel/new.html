<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="panel-key" content="%%PANEL_KEY%%">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%91%A5%3C/text%3E%3C/svg%3E">
  <title>Oda aç · Birlikte İzle</title>
  <link rel="stylesheet" href="/css/panel.css">
  <script type="module" src="/js/new.js"></script>
</head>
<body>
  <header class="head">
    <div class="head-actions">
      <button id="geri" type="button">◀ Geri</button>
      <h1>👥 Oda aç</h1>
    </div>
  </header>
  <main class="narrow">
    <section class="card">
      <div class="meta">
        <img id="poster" alt="" hidden>
        <div>
          <h2 id="title">Yükleniyor…</h2>
          <p class="muted">Arkadaşlarınla izlemek istediğin stream'i seç. Oda açılınca linki paylaşırsın.</p>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="row">
        <input id="filter" placeholder="Filtrele (ör. 1080p, x265, türkçe)" autocomplete="off">
      </div>
      <div class="row quality-row">
        <div id="quality-chips" class="chips"></div>
        <button id="refresh-addons" type="button" class="refresh-btn">↻ Addon'ları tekrar ara</button>
      </div>
      <div class="row">
        <label><input id="masaustu" type="checkbox"> Odayı masaüstü uygulamasında aç</label>
        <span class="muted small">Gerçek HDR, tüm ses dilleri, donanım çözme. Uygulama kurulu değilse tarayıcıda açılır.</span>
      </div>
      <p id="errors" class="error small" hidden></p>
      <div id="streams"><p class="muted">Addon'lardan stream'ler alınıyor…</p></div>
    </section>
  </main>
</body>
</html>
