<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="panel-key" content="%%PANEL_KEY%%">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%91%A5%3C/text%3E%3C/svg%3E">
  <title>Film ara · Birlikte İzle</title>
  <link rel="stylesheet" href="/css/panel.css">
  <script type="module" src="/js/ara.js"></script>
</head>
<body>
  <header class="head">
    <h1>🔎 Film ara</h1>
    <a class="button" href="/">Panel</a>
  </header>
  <main class="narrow">
    <section class="card">
      <div class="row">
        <input id="ara-input" placeholder="Film ya da dizi adı" autocomplete="off" autofocus>
        <button id="ara-btn" type="button">Ara</button>
      </div>
      <p id="ara-durum" class="muted">Aramak için yaz.</p>
    </section>

    <section class="card" id="filmler-kart" hidden>
      <h2>🎬 Filmler</h2>
      <div id="filmler" class="poster-izgara"></div>
    </section>

    <section class="card" id="diziler-kart" hidden>
      <h2>📺 Diziler</h2>
      <div id="diziler" class="poster-izgara"></div>
    </section>

    <section class="card" id="bolumler-kart" hidden>
      <h2 id="bolumler-baslik">Bölümler</h2>
      <div class="row">
        <button id="bolum-geri" type="button">◀ Aramaya dön</button>
      </div>
      <div id="bolumler" class="bolum-liste"></div>
    </section>
  </main>
</body>
</html>
